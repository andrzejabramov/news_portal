{# templates/news/_subscribe_button.html #}
{% load subscription_tags %}

{% if user.is_authenticated %}
    {% check_subscription user.id category.id as is_subscribed %}
    
    <form method="post" 
          action="{% url 'news:subscribe' category.pk %}" 
          style="display: inline-block;">
        {% csrf_token %}
        {% if is_subscribed %}
            <button type="submit" 
                    name="action" 
                    value="unsubscribe"
                    style="min-width: 120px; padding: 5px 12px; background: #fff; color: #f44336; border: 1px solid #f44336; border-radius: 3px; cursor: pointer; font-size: 12px; text-align: center; white-space: nowrap; display: inline-block;"
                    title="Отписаться от уведомлений"
                    onclick="return confirm('Отписаться от уведомлений по категории «{{ category.name }}»?');">
                🔕 Отписаться
            </button>
        {% else %}
            <button type="submit" 
                    name="action" 
                    value="subscribe"
                    style="min-width: 120px; padding: 5px 12px; background: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; text-align: center; white-space: nowrap; display: inline-block;"
                    title="Подписаться на уведомления">
                🔔 Подписаться
            </button>
        {% endif %}
    </form>
{% else %}
    <a href="{% url 'account_login' %}?next={{ request.path }}" 
       style="min-width: 120px; display: inline-block; padding: 5px 12px; background: #e0e0e0; color: #666; border: 1px solid #ccc; border-radius: 3px; text-decoration: none; font-size: 12px; text-align: center; box-sizing: border-box; white-space: nowrap;"
       title="Войдите, чтобы подписаться на уведомления">
        🔔 Войти
    </a>
{% endif %}
