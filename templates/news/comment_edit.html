<!-- templates/news/comment_edit.html -->
{% extends 'flatpages/default.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">✏️ Редактирование комментария</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="{{ form.text.id_for_label }}" class="form-label">Текст комментария</label>
                            {{ form.text }}
                            {% if form.text.errors %}
                                <div class="invalid-feedback d-block">
                                    {{ form.text.errors }}
                                </div>
                            {% endif %}
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                💾 Сохранить изменения
                            </button>
                            <a href="{% url 'news:post_with_comments' pk=comment.post.pk %}" class="btn btn-secondary">
                                ❌ Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
